<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Let's talk about aliens 👽</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/languagePicker.css">
    <link rel="stylesheet" href="styles/shareButtonTooltip.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>

<body>
    <div class="container" role="application">
        <header>
            <div class="lang-select" aria-hidden="false">
                <select id="lang" aria-label="Select language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="pt">Português</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
        </header>

        <div class="questionSection">
            <h1 class="questionTextSpan" id="questionTextSpan"></h1>
        </div>

        <div class="tooltip" id="tooltip">
            <button class="shareButton" id="shareButton">
                <span class="tooltiptext" id="myTooltip" data-lang="tooltip"></span>
                <img id="shareButtonImage" src="./images/share_icon.png" alt="sharepng" />
            </button>
        </div>

        <div id="questionsCounterDiv" class="questionsCounterDiv" hidden>
            <h2 class="questionsCounterLabel" id="questionsCounterLabel" hidden></h2>
        </div>

        <div class="buttonsSection">
            <button class="nextQuestionButton" id="nextQuestionButton" role="button" data-lang="primary">
                Start Game! 🎲 
            </button>
        </div>

        <footer>
            <p data-lang="footer">Made with ❤️ — 2025</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script  type="module" src="js/main.js"></script>
    <script type="module" src="js/languagePicker.js"></script>
</body>

</html>
